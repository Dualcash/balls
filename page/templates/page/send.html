<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const message = 'Привет';
            const chatId = '791326546';
            const botToken = 'http://188.225.44.248:8000';
    
            fetch(`${botToken}/send-message`, {
                method: 'POST',
                mode: 'cors',  // Добавляем CORS
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    user_id: chatId,
                    text: message
                })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Ошибка сервера: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                console.log('Ответ сервера:', data);
            })
            .catch(error => {
                console.error('Ошибка при отправке сообщения:', error);
            });
        });
    </script>
</body>
</html>
